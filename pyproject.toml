[project]
name = "elintelligence"
version = "1.1.2"
description = "Local-first Windows AI assistant with GGUF inference, RAG and optional web search"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "ELPythonEMI" }]
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6==6.11.2",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=6,<7",
  "keyring>=25,<26",
]

[tool.pyinstaller]
name = "ELintelligence"
